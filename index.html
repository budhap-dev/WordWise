<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="WordWise: a richer, more precise everyday vocabulary in British English, a few minutes a day."
    />
    <meta name="theme-color" content="#FAF7F2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14161A" media="(prefers-color-scheme: dark)" />
    <title>WordWise: find exactly the right word</title>

    <!-- Link previews (WhatsApp, iMessage, Slack, LinkedIn…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WordWise" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:url" content="https://wordwise-daily.vercel.app/" />
    <meta property="og:title" content="WordWise: find exactly the right word" />
    <meta
      property="og:description"
      content="British English vocabulary, a few minutes a day: a word of the day, smart reviews, quick games and a daily laugh."
    />
    <meta property="og:image" content="https://wordwise-daily.vercel.app/og-image.jpg" />
    <meta property="og:image:secure_url" content="https://wordwise-daily.vercel.app/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="WordWise: find exactly the right word. Word of the day card for 'kerfuffle'."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WordWise: find exactly the right word" />
    <meta name="twitter:description" content="British English vocabulary, a few minutes a day." />
    <meta name="twitter:image" content="https://wordwise-daily.vercel.app/og-image.jpg" />
    <script>
      // Apply the saved theme and colour palette before first paint to avoid a flash.
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('wordwise:settings') || 'null');
          var t = (s && s.theme) || 'system';
          var dark =
            t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          if (s && s.palette && s.palette !== 'indigo')
            document.documentElement.setAttribute('data-palette', s.palette);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
