<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="WordWise: a richer, more precise everyday vocabulary in British English, a few minutes a day."
    />
    <meta name="theme-color" content="#FAF7F2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14161A" media="(prefers-color-scheme: dark)" />
    <title>WordWise</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('wordwise:settings') || 'null');
          var t = (s && s.theme) || 'system';
          var dark =
            t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
